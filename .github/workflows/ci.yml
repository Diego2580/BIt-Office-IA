name: AI Office CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-security:
    name: Code Quality, SAST & Test Suite
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: "mock_ci_action_key_12345"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias del sistema y proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Linting y verificación de formato (Ruff)
        run: |
          python -m ruff check office.py tests/

      - name: Análisis estático de seguridad SAST (Bandit)
        run: |
          python -m bandit -r office.py -ll

      - name: Ejecución de tests automatizados (Pytest)
        run: |
          python -m pytest tests/ -v --tb=short

  docker-build-verification:
    name: Container Image Build Check
    runs-on: ubuntu-latest
    needs: quality-and-security

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker (Dry Run / Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-office:ci-test
